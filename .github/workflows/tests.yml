name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Engine-independent tests (stub Билетная)
        run: |
          python -m unittest \
            tests.test_url_delivery \
            tests.test_telegram_file_transport \
            tests.test_new_features \
            tests.test_broadcast_guard \
            tests.test_daily_free \
            tests.test_free_tier_flow \
            -v
